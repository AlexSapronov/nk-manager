name: Prototype browser checks
on: [push, pull_request]
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: python scripts/build_preview.py
      - run: git diff --exit-code prototype/preview.html
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototype-browser-evidence
          path: |
            docs/screenshots/
            docs/browser-report.json
