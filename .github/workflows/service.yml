name: Service and NK contract checks
on: [push, pull_request]
jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest tests -q
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tests/field-visibility.cjs
      - run: node tests/creation-ui.cjs
      - run: node tests/live-browser.cjs
        env:
          NK_TEST_PYTHON: python
      - run: node tests/nk-browser.cjs
        env:
          NK_TEST_PYTHON: python
      - run: node tests/template-browser.cjs
        env:
          NK_TEST_PYTHON: python
      - run: node tests/normalization-browser.cjs
        env:
          NK_TEST_PYTHON: python
      - run: node tests/category-browser.cjs
        env:
          NK_TEST_PYTHON: python
      - run: node tests/draft-workflow-browser.cjs
        env:
          NK_TEST_PYTHON: python
      - run: node tests/bulk-creation-browser.cjs
        env:
          NK_TEST_PYTHON: python
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: local-service-browser-evidence
          path: |
            docs/live-browser-report.json
            docs/nk-browser-report.json
            docs/template-browser-report.json
            docs/normalization-browser-report.json
            docs/category-browser-report.json
            docs/draft-workflow-browser-report.json
            docs/bulk-creation-browser-report.json
            docs/screenshots/bulk-creation*.png
            docs/screenshots/draft-workspace*.png
            docs/screenshots/category-*.png
            docs/screenshots/normalization-*.png
            docs/screenshots/template-*.png
            docs/screenshots/creation-*.png
            docs/screenshots/nk-*.png
            docs/screenshots/live-*.png
